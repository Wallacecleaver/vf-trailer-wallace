# Généré par l'installeur de l'image. Démarrer :  docker compose up -d
# Mettre à jour :                                  docker compose pull && docker compose up -d
# Le HTTPS est géré par ton propre reverse proxy : fais-le pointer vers le port de l'addon (3000 par défaut).
# Un seul conteneur : la base SQLite est un simple fichier dans le volume `data` (survit aux mises à jour).

services:
  app:
    image: __IMAGE__
    restart: unless-stopped
    env_file: .env
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - data:/data
    ports:
      # BIND_ADDRESS=127.0.0.1 si ton reverse proxy tourne sur cette même machine (le port n'est alors pas exposé à Internet).
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3000}:3000"

volumes:
  data:
