# Déploiement « git pull » sur un VPS (ou n'importe quel hôte Docker) :
#   cp .env.example .env   (puis remplis DASHBOARD_PASSWORD, APP_BASE_URL, TMDB_API_KEY)
#   docker compose up -d --build
# Mise à jour :  git pull && docker compose up -d --build
# Les données (réglages dashboard, mapping, stats) vivent dans le volume `data` : elles survivent aux mises à jour.
# Base SQLite intégrée (fichier /data/addon.sqlite) : un seul conteneur, rien d'autre à installer.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - data:/data
    ports:
      # 127.0.0.1 par défaut : l'addon est censé être derrière un reverse proxy HTTPS.
      # Pour un accès direct, mets BIND_ADDRESS=0.0.0.0 dans .env (déconseillé).
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
